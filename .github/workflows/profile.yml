name: Actualizar perfil

on:
  schedule:
    - cron: "23 10 * * *"   # todos los días, 05:23 hora de Lima
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]
    paths:
      - profile.yml
      - scripts/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Generar SVGs y tablas
        run: python scripts/generate.py
        env:
          # PROFILE_TOKEN (opcional) suma tus contribuciones privadas.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: actualizar perfil"
            git push
          fi
