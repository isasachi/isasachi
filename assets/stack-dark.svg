<svg xmlns="http://www.w3.org/2000/svg" width="430" height="278" viewBox="0 0 430 278" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" role="img" aria-label="~/.config — stack">
<style>
text{white-space:pre;font-variant-ligatures:none}
